name: Deploy Research Atlas
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "research-atlas-pages"
  cancel-in-progress: true
jobs:
  build:
    name: Validate and build static catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate program records
        run: node scripts/build.mjs --check
      - name: Build current database for Pages
        run: node scripts/build.mjs
      - name: Check generated dataset and app
        run: |
          node --check docs/assets/app.js
          node -e "let d=require('./docs/data/catalog.json');if(d.total<100||!d.programs.every(p=>p.source_url))process.exit(1);console.log('Ready:',d.total)"
      - name: Produce open data exports
        run: |
          node scripts/export.mjs
          node scripts/audit.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
